[package]
name = "prisma_hook"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
description = "Limitador de FPS e HDR do Prisma, carregado no jogo só quando a pessoa pede"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }

[workspace]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
