[package]
name = "prisma-apo"
version = "0.1.0"
edition = "2024"
description = "APO do equalizador do Prisma: aplica o perfil de prisma-eq e anota tudo num log"

[lib]
# cdylib: a DLL que o motor de áudio carrega; rlib: para o teste dentro do processo.
crate-type = ["cdylib", "rlib"]

[dependencies]
prisma-eq = { path = "../prisma-eq" }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
