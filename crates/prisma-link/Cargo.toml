[package]
name = "prisma-link"
version = "0.1.0"
edition = "2024"
description = "Protocolo e enquadramento da ponte entre o Prisma Launcher e o Prisma"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO"] }
